<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>:root{--Teal:#00796E;--Ink:#0F1B2A;--Muted:#4B5B6B;--Paper:#F2F6F7;--Amber:#F59E0B;--BrandStrong:#005F56;--BrandSoft:#E3F4F1;--Line:#DCE5E8;--DividerTone:#E6EDEF;--Chevron:#9AA8B4;--Sky:#0369A1;--SkySoft:#E0F2FE;--Warm:#B45309;--WarmSoft:#FFF4E5;--Violet:#6D28D9;--VioletSoft:#F1EBFE;--Success:#1B7A3E;--SuccessSoft:#E6F4EA;--Danger:#B42318;--DangerSoft:#FDECEA;--DangerLine:#F3C5C0;}
*{box-sizing:border-box}body{margin:0;background:var(--Paper);color:var(--Ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:15px}header{height:59px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--Line);font-size:19px;font-weight:650}.tag{font-size:10px;letter-spacing:.3px;font-weight:500;padding:5px 7px;color:var(--Muted);background:var(--Paper);border-radius:5px}.content{padding:16px;display:flex;flex-direction:column;gap:14px}h2,h3,p{margin:0}h2{font-size:20px;font-weight:650}h3{font-size:16px;font-weight:600}p{line-height:1.6}.small{font-size:12px;color:var(--Muted);line-height:1.6}.card{border:1px solid var(--Line);border-radius:18px;background:white;box-shadow:0 1px 2px #0f1b2a08;padding:18px}.row{display:flex;align-items:center;gap:14px}.spread{justify-content:space-between}.grow{flex:1}.profile{background:var(--BrandSoft);border-radius:20px;padding:18px}.avatar{color:var(--Teal);background:white;border-radius:50%;width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex:none}.city{font-size:11px;border:1px solid #00796e66;background:white;color:var(--Teal);padding:2px 5px;border-radius:4px}.edit{color:var(--Teal);background:none;border:1px solid var(--Teal);border-radius:10px;padding:8px 11px;font:inherit;font-size:13px}.tiles{display:flex;gap:8px}.tile{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 6px;border:1px solid #00000012;border-radius:14px;font-size:13px}.tile:nth-child(1){background:var(--SkySoft)}.tile:nth-child(1) svg{color:var(--Sky)}.tile:nth-child(2){background:var(--BrandSoft)}.tile:nth-child(2) svg{color:var(--Teal)}.tile:nth-child(3){background:var(--WarmSoft)}.tile:nth-child(3) svg{color:var(--Warm)}.menucard{padding:12px 18px}.menutitle{font-weight:600;margin:4px 0 6px}.menu{padding:10px 0;min-height:54px;display:flex;align-items:center;gap:14px}.menu+.menu{border-top:1px
