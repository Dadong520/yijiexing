<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宜捷行 · 运营管理中心</title><link rel="stylesheet" href="/static/admin.css"></head><body>
<section id="login" class="login"><div class="login-intro"><div class="brand"><b>宜</b> 宜捷行</div><h1>每一程，<br>清晰可见。</h1><p>司机、乘客与运营共享同一份业务记录。<br>独立云体验环境 · 全流程协同管理</p></div><form id="loginForm" class="loginbox"><span class="eyebrow">OPERATIONS CONSOLE</span><h2>登录管理中心</h2><p class="muted">使用后台管理账号和密码登录。</p><label>管理员用户名<input id="username" required maxlength="64" autocomplete="username" placeholder="请输入管理账号"></label><label>管理员密码<input id="password" type="password" required maxlength="128" autocomplete="current-password" placeholder="请输入管理密码"></label><button class="primary" id="loginBtn">登录管理中心 →</button><p id="loginError" class="error" role="alert"></p><small>凭据仅保存在当前页面内存；刷新页面需重新登录。</small></form></section>
