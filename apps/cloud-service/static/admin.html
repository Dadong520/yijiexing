<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宜捷行 · 云演示运营控制台</title><link rel="stylesheet" href="/static/admin.css"></head><body>
<div id="login" class="login"><div class="loginbox"><div class="brandmark">宜</div><h1>宜捷行云演示控制台</h1><p>与安卓原生端共用独立 SQLite 数据。<br>全部资料、支付、提现均为云演示沙箱。</p><label>独立管理令牌<input id="tokenInput" type="password" autocomplete="off" placeholder="由管理员从独立云部署凭据中读取"></label><button id="loginBtn" class="primary">进入控制台</button><small>仅经 Google Cloud IAM 授权的管理代理访问；不会连接原测试或生产环境。</small><p id="loginError" class="error"></p></div></div>
<div id="app" hidden><aside><div class="brand"><b>宜</b><span>宜捷行<small>云演示运营控制台</small></span></div><nav id="nav"></nav><div class="asidefoot"><i></i> 隔离沙箱运行中<br><small>版本 0.3 · 原生端联调</small></div></aside><div class="workspace"><header><div><span class="crumb">云演示工作空间 /</span> <b id="pageTitle">等级总览</b></div><div class="headeractions"><select id="actor"><option value="local-editor">配置编辑员</option><option value="local-approver-1">一级审批员</option><option value="local-approver-2">二级审批员</option></select><button id="refreshBtn">刷新</button><button id="logoutBtn">退出</button></div></header><main><div class="sandbox">云演示隔离环境 · 合成数据 · 支付、短信、银行、发票和自动扣款均未连接真实服务</div><div id="content"></div></main></div></div>
<div id="modal" class="modal" hidden><section><div class="modalhead"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="关闭弹窗">×</button></div><div id="modalBody"></div><div id="modalFoot" class="modalfoot"></div></section></div><div id="toast" role="status"></div><script src="/static/admin.js"></script></body></html>
